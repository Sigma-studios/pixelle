[package]
name = "pixelle-editor"
description = "The Pixelle editor: an indexed pixel-art editor for game sprites and terrains"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pixelle-editor"
path = "src/main.rs"

[dependencies]
pixelle-core.workspace = true
eframe = "0.36"
rfd = "0.17"
anyhow.workspace = true
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColorSpace"] }
