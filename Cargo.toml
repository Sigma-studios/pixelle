[workspace]
resolver = "3"
members = [
    "crates/pixelle-core",
    "crates/pixelle-build",
    "crates/pixelle-editor",
    "crates/bevy_pixelle",
    "examples/bevy-showcase",
]
default-members = ["crates/pixelle-editor"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sigma-studios/pixelle"

[workspace.dependencies]
pixelle-core = { path = "crates/pixelle-core" }
pixelle-build = { path = "crates/pixelle-build" }
bevy_pixelle = { path = "crates/bevy_pixelle" }
bevy = { version = "0.19", default-features = false, features = ["2d"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
miniz_oxide = "0.8"
glam = { version = "0.30", features = ["serde"] }
png = "0.18"
ron = "0.10"
anyhow = "1"
